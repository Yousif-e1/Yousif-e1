<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-label="Terminal session showing Yousif Elalfy's profile">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080d16"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#0a101c"/>
    </linearGradient>
    <linearGradient id="tsheen" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e58a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e58a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e58a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tframe"><rect x="0" y="0" width="900" height="336" rx="12"/></clipPath>

    <!-- per-line typing wipes -->
    <clipPath id="w1"><rect x="0" y="59" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="0.25s" dur="0.26s" fill="freeze"/></rect></clipPath>
    <clipPath id="w2"><rect x="0" y="83" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="0.58s" dur="0.34s" fill="freeze"/></rect></clipPath>
    <clipPath id="w3"><rect x="0" y="111" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="1.00s" dur="0.26s" fill="freeze"/></rect></clipPath>
    <clipPath id="w4"><rect x="0" y="135" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="1.30s" dur="0.42s" fill="freeze"/></rect></clipPath>
    <clipPath id="w5"><rect x="0" y="163" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="1.78s" dur="0.26s" fill="freeze"/></rect></clipPath>
    <clipPath id="w6"><rect x="0" y="187" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="2.08s" dur="0.30s" fill="freeze"/></rect></clipPath>
    <clipPath id="w7"><rect x="0" y="215" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="2.60s" dur="0.46s" fill="freeze"/></rect></clipPath>
    <clipPath id="w8"><rect x="0" y="239" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="2.98s" dur="0.36s" fill="freeze"/></rect></clipPath>
    <clipPath id="w9"><rect x="0" y="267" width="0" height="26"><animate attributeName="width" from="0" to="900" begin="3.48s" dur="0.16s" fill="freeze"/></rect></clipPath>

    <style>
      .m { font-family: 'Cascadia Mono','Consolas','DejaVu Sans Mono','Liberation Mono',monospace; }
      @keyframes blink { 0%,47% { opacity: 1; } 48%,100% { opacity: 0; } }
      @keyframes drift { 0% { transform: translateX(-900px); } 100% { transform: translateX(900px); } }
      .cur { animation: blink 1.05s step-end infinite; }
      .sheen { animation: drift 9s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#tframe)">
    <rect width="900" height="336" fill="url(#tbg)"/>

    <!-- slow sheen sweep across the panel -->
    <rect class="sheen" x="0" y="40" width="900" height="1.4" fill="url(#tsheen)" opacity="0.55"/>

    <!-- title bar -->
    <rect width="900" height="40" fill="url(#tbar)"/>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#1a2740" stroke-width="1"/>
    <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="64" cy="20" r="5.5" fill="#28c840"/>
    <text class="m" x="450" y="24" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#465974">yousif@kali: ~/ops</text>

    <g class="m" font-size="13.5" letter-spacing="0.2">
      <g clip-path="url(#w1)">
        <text x="28" y="78" fill="#00e58a">$</text>
        <text x="46" y="78" fill="#e8eef7">whoami</text>
      </g>
      <g clip-path="url(#w2)">
        <text x="28" y="102" fill="#8ea1bd">yousif-elalfy</text>
        <text x="140" y="102" fill="#44597a">// offensive security researcher</text>
      </g>
      <g clip-path="url(#w3)">
        <text x="28" y="130" fill="#00e58a">$</text>
        <text x="46" y="130" fill="#e8eef7">cat focus.txt</text>
      </g>
      <g clip-path="url(#w4)">
        <text x="28" y="154" fill="#8ea1bd">web app</text>
        <text x="102" y="154" fill="#44597a">·</text>
        <text x="118" y="154" fill="#8ea1bd">API</text>
        <text x="158" y="154" fill="#44597a">·</text>
        <text x="174" y="154" fill="#8ea1bd">cloud (AWS / Azure)</text>
        <text x="322" y="154" fill="#44597a">·</text>
        <text x="338" y="154" fill="#8ea1bd">mobile</text>
        <text x="398" y="154" fill="#44597a">·</text>
        <text x="414" y="154" fill="#8ea1bd">DevSecOps</text>
      </g>
      <g clip-path="url(#w5)">
        <text x="28" y="182" fill="#00e58a">$</text>
        <text x="46" y="182" fill="#e8eef7">ls -1 certs/</text>
      </g>
      <g clip-path="url(#w6)">
        <text x="28" y="206" fill="#38e1ff">eWPTX</text>
        <text x="98" y="206" fill="#38e1ff">eMAPT</text>
        <text x="168" y="206" fill="#38e1ff">CAP</text>
        <text x="214" y="206" fill="#38e1ff">CNSP</text>
        <text x="272" y="206" fill="#44597a">// INE · SecOps Group</text>
      </g>
      <g clip-path="url(#w7)">
        <text x="28" y="234" fill="#00e58a">$</text>
        <text x="46" y="234" fill="#e8eef7">./hunt --target enterprise --responsible-disclosure</text>
      </g>
      <g clip-path="url(#w8)">
        <text x="28" y="258" fill="#00e58a">[+]</text>
        <text x="64" y="258" fill="#8ea1bd">5 high-severity findings disclosed</text>
        <text x="360" y="258" fill="#44597a">· incl. TikTok</text>
      </g>
      <g clip-path="url(#w9)">
        <text x="28" y="286" fill="#00e58a">$</text>
      </g>
    </g>

    <!-- cursor appears once the last prompt lands, then blinks forever -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.70s" dur="0.01s" fill="freeze"/>
      <rect class="cur" x="46" y="273" width="8.5" height="16" fill="#00e58a"/>
    </g>

    <rect x="0.7" y="0.7" width="898.6" height="334.6" rx="12" fill="none" stroke="#16253d" stroke-width="1.4"/>
  </g>
</svg>
